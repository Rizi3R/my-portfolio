<!doctype html>
<!-- Source for public/og-image.png (1200x630 link-preview card).
     Regenerate: node scripts/renderOgImage.cjs -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Geist:wght@400;500&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #0A0913; color: #F6F2E9; font-family: Geist, sans-serif; overflow: hidden; }
  .card { position: relative; height: 100%; padding: 72px 80px; display: flex; flex-direction: column; }
  .glow { position: absolute; inset: 0; background:
      radial-gradient(640px circle at 92% 8%, rgba(168,197,255,.20), transparent 60%),
      radial-gradient(520px circle at 4% 104%, rgba(242,167,125,.12), transparent 60%); }
  .grid { position: absolute; inset: 0; opacity: .35;
      background-image: linear-gradient(#242138 1px, transparent 1px), linear-gradient(90deg, #242138 1px, transparent 1px);
      background-size: 48px 48px; mask-image: radial-gradient(800px circle at 100% 0%, #000, transparent 70%); }
  .rim { position: absolute; inset: 24px; border: 1px solid #242138; border-radius: 28px; }
  .z { position: relative; }
  .eyebrow { font: 500 30px 'JetBrains Mono', monospace; color: #A8C5FF; letter-spacing: .04em; }
  h1 { font: 700 84px/1.02 'Bricolage Grotesque', sans-serif; letter-spacing: -.02em; margin-top: 22px; max-width: 900px; }
  .rule { width: 72px; height: 4px; background: #F2A77D; border-radius: 2px; margin-top: 30px; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: auto; }
  .chip { font-size: 22px; padding: 10px 20px; border: 1px solid #3A3654; border-radius: 999px; background: #12101F; color: #E6E1D6; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 30px;
      font: 500 21px 'JetBrains Mono', monospace; color: #CFCAC0; }
  .foot b { color: #F6F2E9; font-weight: 500; }
  .dot { color: #F2A77D; }
</style></head>
<body><div class="card">
  <div class="glow"></div><div class="grid"></div><div class="rim"></div>
  <div class="z eyebrow">Aries Razak</div>
  <h1 class="z">IT Operations &amp; Application Support</h1>
  <div class="z rule"></div>
  <div class="z chips">
    <span class="chip">Application support</span>
    <span class="chip">Business systems &amp; SaaS</span>
    <span class="chip">Integrations</span>
    <span class="chip">IT operations</span>
  </div>
  <div class="z foot">
    <span><b>13</b> case studies <span class="dot">·</span> AWS Certified Cloud Practitioner</span>
    <span>aries-razak.vercel.app</span>
  </div>
</div></body></html>

name: Security & Build Verification

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies cleanly from lockfile
        run: npm ci

      - name: TypeScript & lint verification
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Validate portfolio content integrity
        run: npm run validate:content

      - name: Validate multilingual bundles and locale helpers
        run: npm run validate:i18n

      - name: Production build
        run: npm run build

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: State and accessibility smoke tests
        run: npm run test:e2e

      - name: Build hygiene check (no source maps or obvious credential patterns in dist/)
        run: |
          if find dist -name '*.map' | grep -q .; then
            echo "ERROR: Source maps found in production dist/"
            exit 1
          fi
          if grep -rlE 'UPSTASH_REDIS_REST_TOKEN|KV_REST_API_TOKEN|VISITOR_HASH_SALT|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' dist/; then
            echo "ERROR: Sensitive pattern detected in listed production dist/ file(s)"
            exit 1
          fi

      - name: Audit production dependencies (high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency tree (high/critical)
        run: npm audit --audit-level=high
